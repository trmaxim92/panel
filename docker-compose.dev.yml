# Local MikoPBX for theme/UI work on Windows Docker Desktop
# Web only (SIP/RTP optional) — full telephony stays on VPS
services:
  mikopbx:
    container_name: mikopbx-dev
    image: ghcr.io/mikopbx/mikopbx:latest
    entrypoint: /sbin/docker-entrypoint
    hostname: mikopbx-dev
    restart: unless-stopped
    tty: true
    ports:
      - "18080:80"
      - "18443:443"
      # optional local softphone tests (may conflict with other apps)
      - "15060:5060/udp"
      - "15060:5060/tcp"
    volumes:
      - mikopbx_cf:/cf
      - mikopbx_storage:/storage
      - ./theme:/theme:ro
    environment:
      - PBX_NAME=СкайСкейл-DEV
      - SSH_PORT=23
      - WEB_PORT=80
      - WEB_HTTPS_PORT=443
      - SIP_PORT=5060
      - TLS_PORT=5061
      - RTP_PORT_FROM=10000
      - RTP_PORT_TO=10100
      - WEB_ADMIN_LOGIN=admin
      - WEB_ADMIN_PASSWORD=${WEB_ADMIN_PASSWORD:-admin}
      - PBX_FIREWALL_ENABLED=0
      - ENABLE_USE_NAT=1

volumes:
  mikopbx_cf:
  mikopbx_storage:
