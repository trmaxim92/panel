# Clean MikoPBX install — host network (recommended for SIP/RTP)
# Docs: https://docs.mikopbx.com/mikopbx/english/setup/docker/
services:
  mikopbx:
    container_name: mikopbx
    image: ghcr.io/mikopbx/mikopbx:latest
    network_mode: host
    entrypoint: /sbin/docker-entrypoint
    hostname: mikopbx
    restart: always
    tty: true
    volumes:
      - /var/spool/mikopbx/cf:/cf
      - /var/spool/mikopbx/storage:/storage
      - ./theme/skyscale-theme.css:/offload/rootfs/usr/www/sites/admin-cabinet/assets/css/skyscale-theme.css:ro
    environment:
      - ID_WWW_USER=${ID_WWW_USER}
      - ID_WWW_GROUP=${ID_WWW_GROUP}
      - PBX_NAME=СкайСкейл
      # Host SSH stays on 22; Miko SSH inside container on 23
      - SSH_PORT=23
      - WEB_PORT=80
      - WEB_HTTPS_PORT=443
      - SIP_PORT=5060
      - TLS_PORT=5061
      - RTP_PORT_FROM=10000
      - RTP_PORT_TO=10800
      - AMI_PORT=5038
      - AJAM_PORT=8088
      - AJAM_PORT_TLS=8089
      # Change immediately after first login
      - WEB_ADMIN_LOGIN=admin
      - WEB_ADMIN_PASSWORD=${WEB_ADMIN_PASSWORD:-ChangeMeNow}
